[project]
name = "dic"
version = "0.1.0"
description = "a minimalist CLI for chat LLMs"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "bandit[toml]>=1.7"]

[project.scripts]
dic = "dic.__main__:main"
accio = "accio.__main__:main"
git-apply-fuzzy = "git_apply_fuzzy.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The shell scripts live at the repository root and not under src/, so that
# a checkout can source them directly; mapping the package onto scripts/
# ships them as dic/scripts/ in the wheel, which is what a pip-installed
# `dic --init` names.  The list is explicit because packages.find cannot
# discover a package whose directory is outside src/.
[tool.setuptools]
packages = ["accio", "dic", "dic.adaptors", "dic.tools", "dic.scripts", "git_apply_fuzzy"]
package-dir = {"" = "src", "dic.scripts" = "scripts"}
include-package-data = true

[tool.setuptools.package-data]
dic = ["models.json"]
"dic.scripts" = ["*.sh", "*.c"]

[tool.pytest.ini_options]
markers = ["slow: starts a real dic process; left out of the default run"]
addopts = "-m 'not slow' --doctest-modules"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["F", "B", "SIM", "UP", "RUF", "ARG", "A", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "A"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B404", "B603"]
